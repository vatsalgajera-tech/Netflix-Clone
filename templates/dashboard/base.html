{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Admin Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Admin Styles -->
    <link rel="stylesheet" href="{% static 'admin_style.css' %}">
</head>

<body>
    <div class="container-fluid p-0">
        <div class="d-flex">
            <!-- Sidebar -->
            <nav class="sidebar d-flex flex-column" style="width: 250px;">
                <a href="{% url 'dashboard:home' %}" class="sidebar-brand text-decoration-none">
                    <img src="{% static 'netflix.png' %}" alt="NETFLIX"
                        style="height: 35px; object-fit: contain; margin-bottom: 20px;">
                </a>

                <div class="px-3 mt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                                href="{% url 'dashboard:home' %}">
                                <i class="fa-solid fa-gauge"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'movies' %}active{% endif %}"
                                href="{% url 'dashboard:movies' %}">
                                <i class="fa-solid fa-film"></i> Movies
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'series' %}active{% endif %}"
                                href="{% url 'dashboard:series' %}">
                                <i class="fa-solid fa-tv"></i> Series
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'categories' %}active{% endif %}"
                                href="{% url 'dashboard:categories' %}">
                                <i class="fa-solid fa-list"></i> Categories
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'users' %}active{% endif %}"
                                href="{% url 'dashboard:users' %}">
                                <i class="fa-solid fa-users"></i> Users
                            </a>
                        </li>

                        <li class="nav-item mt-4">
                            <form method="post" action="{% url 'account_logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="nav-link w-100 text-start bg-transparent border-0">
                                    <i class="fa-solid fa-power-off"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="flex-grow-1 main-content" style="min-height: 100vh; background-color: var(--dark-bg);">
                <!-- Top Header -->
                <div class="d-flex justify-content-end align-items-center top-navbar">
                    <a href="/" class="btn btn-sm me-3" style="font-size: 13px; border: 1px solid var(--border-color); color: #000;">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> View Site
                    </a>
                    <span class="d-flex align-items-center fw-bold" style="color: #000; font-size: 15px;">
                        <i class="fa-solid fa-user-shield me-2"></i> Admin
                    </span>
                </div>

                <!-- Page Content -->
                <div class="p-4 px-md-5 py-md-4">
                    {% block content %}
                    {% endblock %}
                </div>

                <!-- Footer -->
                <div class="text-center mt-5 mb-4" style="color: #666; font-size: 12px;">
                    © 2024 Netflix Clone. All rights reserved.
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
